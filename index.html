<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hello BDCC</title>
	<style>
		:root {
			font-family: "Trebuchet MS", sans-serif;
			color: #17324d;
			background: #dff4f1;
		}
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			background: linear-gradient(135deg, #dff4f1, #f9e7c8);

		h1 {
			margin: 0;
			padding: 1.5rem 2.5rem;
			border: 3px solid #17324d;
			border-radius: 16px;
			box-shadow: 8px 8px 0 #f28f79;
			background: #fffaf0;
			font-size: clamp(2rem, 8vw, 5rem);
			letter-spacing: 0.04em;
			text-align: center;
		}

	<h1>hello BDCC V3</h1>
</body>
</html>
